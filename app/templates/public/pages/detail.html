{% extends "base_public.html" %}
{% block title %}{{ page.title }} | {{ tenant.public_name }}{% endblock %}
{% block content %}
<article class="cms-article">
  <a class="text-link" href="{% url 'page_index' %}{{ tenant_preview_query }}">← All pages</a>
  <p class="eyebrow">FROM {{ tenant.public_name|upper }}</p>
  <h1>{{ page.title }}</h1>
  <div class="cms-body">{{ page.body|linebreaks }}</div>
</article>
{% endblock %}
